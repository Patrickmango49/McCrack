<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="application-name" content="McCrack-COS">
  <meta name="description" content="McCrack-COS — a full browser desktop experience.">
  <title>McCrack-COS</title>
  <link rel="icon" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/favicon.png">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05070b}
    body{min-height:100svh}
    #cos-frame{display:block;width:100%;height:100%;height:100svh;border:0;background:#05070b}
    .fallback{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:24px;color:#eafaff;background:#05070b;font:15px/1.5 system-ui,sans-serif;text-align:center}
    .fallback a{color:#78e9f5}
    .fallback[hidden]{display:none}
  </style>
</head>
<body>
  <iframe
    id="cos-frame"
    src="https://patrickmango49.github.io/McCrackOSV3/"
    title="McCrack-COS"
    allow="fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; picture-in-picture"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <noscript>
    <div class="fallback">
      <strong>McCrack-COS needs JavaScript.</strong>
      <a href="https://patrickmango49.github.io/McCrackOSV3/">Open McCrack-COS directly</a>
    </div>
  </noscript>
  <div class="fallback" id="load-fallback" hidden>
    <strong>McCrack-COS isn't loading in this frame.</strong>
    <a href="https://patrickmango49.github.io/McCrackOSV3/" target="_blank" rel="noopener">Open McCrack-COS directly</a>
    <a href="/">Return to McCrack</a>
  </div>
  <script>
    const frame=document.getElementById("cos-frame");
    const fallback=document.getElementById("load-fallback");
    let loaded=false;
    frame.addEventListener("load",()=>{loaded=true;fallback.hidden=true;});
    window.setTimeout(()=>{if(!loaded)fallback.hidden=false;},12000);
  </script>
</body>
</html>
