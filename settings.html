<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - 𝕄𝕔ℂ𝕣𝕒𝕔𝕜</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="styles.css?v=1.1.0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="favicon.png" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar-row">
        <nav class="nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/games">Games</a>
          <a href="/movies">Movies</a>
          <a href="/chat">Chat</a>
          <a href="/apps">Apps</a>
          <a href="/browser">Browser</a>
          <a href="/more">More</a>
        </nav>
        <a class="settings-link active" href="/settings" aria-label="Settings">⚙️</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1>Settings</h1>
        <p>Customize tab name, favicon, tab cloak, and wallpaper presets.</p>
      </section>

      <section class="settings-panel" aria-label="Settings controls">
        <article class="card settings-card">
          <h2>Appearance</h2>
          <label>Theme selector
            <select id="themeSelect" class="input">
              <option value="matte-noir">Matte Noir</option>
              <option value="obsidian-gold">Obsidian Gold</option>
              <option value="monochrome-glass">Monochrome Glass</option>
            </select>
          </label>
          <label>Wallpaper selector
            <select id="presetSelect" class="input">
              <option value="linear-gradient(170deg, #030303 0%, #11100d 45%, #2b2110 100%)">Matte Noir</option>
              <option value="radial-gradient(circle at 50% -12%, rgba(212, 175, 55, 0.16), transparent 34rem), radial-gradient(circle at 8% 14%, rgba(255, 255, 255, 0.045), transparent 28rem), linear-gradient(145deg, #030303 0%, #0c0c0a 48%, #15130e 100%)">Obsidian Gold</option>
              <option value="linear-gradient(170deg, #050505 0%, #151515 45%, #f5f5f5 140%)">Monochrome Glass</option>
            </select>
          </label>
          <label>Custom wallpaper image URL
            <input id="wallpaperUrl" class="input" placeholder="https://example.com/wallpaper.jpg" />
          </label>
          <label>Upload custom wallpaper image
            <input id="wallpaperUpload" class="input" type="file" accept="image/*" />
          </label>
          <div class="settings-actions">
            <button id="saveTheme" class="btn">Save Theme</button>
            <button id="savePreset" class="btn">Apply Wallpaper</button>
            <button id="saveWallpaperUrl" class="btn">Use URL</button>
            <button id="saveWallpaperUpload" class="btn">Use Upload</button>
            <button id="resetWallpaper" class="btn btn-secondary">Reset Wallpaper</button>
          </div>
        </article>

        <article class="card settings-card">
          <h2>Experience</h2>
          <label><input id="animationsToggle" type="checkbox" /> Animations on</label>
          <label><input id="blurToggle" type="checkbox" /> Blur effects on</label>
          <label><input id="reducedMotionToggle" type="checkbox" /> Reduced motion mode</label>
          <label><input id="compactCardToggle" type="checkbox" /> Compact card mode</label>
          <label><input id="largeCardToggle" type="checkbox" /> Large card mode</label>
          <button id="resetAllSettings" class="btn btn-danger">Reset All Settings</button>
        </article>

        <article class="card settings-card">
          <h2>Tab Cloak</h2>
          <input id="tabName" class="input" placeholder="Tab name" />
          <input id="faviconUrl" class="input" placeholder="https://example.com/favicon.ico" />
          <input id="faviconUpload" class="input" type="file" accept="image/*" />
          <div class="settings-actions">
            <button id="saveTab" class="btn">Save Tab Name</button>
            <button id="saveFaviconUrl" class="btn">Save Favicon URL</button>
            <button id="saveFaviconUpload" class="btn">Use Uploaded Favicon</button>
            <button id="applyCloak" class="btn">Apply Default Cloak</button>
            <button id="resetCloak" class="btn btn-secondary">Reset to Site Default</button>
          </div>
          <p class="small" id="cloakInfo"></p>
        </article>
      </section>
    </main>
  </div>

  <script src="app.js?v=1.1.0"></script>
  <script>
    // Edit these two values in code to set your default cloak.
    const DEFAULT_CLOAK_TITLE = 'Google';
    const DEFAULT_CLOAK_FAVICON = 'https://www.google.com/favicon.ico';

    const defaults = window.mcApp.defaults;
    const tabName = document.getElementById('tabName');
    const faviconUrl = document.getElementById('faviconUrl');
    const cloakInfo = document.getElementById('cloakInfo');
    const themeSelect = document.getElementById('themeSelect');
    const wallpaperUrl = document.getElementById('wallpaperUrl');

    tabName.value = localStorage.getItem('mc_tab_name') || defaults.DEFAULT_TITLE;
    faviconUrl.value = localStorage.getItem('mc_favicon_url') || defaults.DEFAULT_FAVICON;
    themeSelect.value = localStorage.getItem('mc_theme') || 'matte-noir';
    wallpaperUrl.value = localStorage.getItem('mc_wallpaper_type') === 'url' ? (localStorage.getItem('mc_wallpaper_value') || '') : '';
    document.getElementById('animationsToggle').checked = localStorage.getItem('mc_animations') !== 'off';
    document.getElementById('blurToggle').checked = localStorage.getItem('mc_blur') !== 'off';
    document.getElementById('reducedMotionToggle').checked = localStorage.getItem('mc_reduced_motion') === 'on';
    document.getElementById('compactCardToggle').checked = localStorage.getItem('mc_card_mode') === 'compact';
    document.getElementById('largeCardToggle').checked = localStorage.getItem('mc_card_mode') === 'large';
    cloakInfo.textContent = `Current default cloak: ${DEFAULT_CLOAK_TITLE} | ${DEFAULT_CLOAK_FAVICON}`;



    document.getElementById('saveTheme').addEventListener('click', () => {
      localStorage.setItem('mc_theme', themeSelect.value);
      window.mcApp.applySettings();
    });

    document.getElementById('saveWallpaperUrl').addEventListener('click', () => {
      const value = wallpaperUrl.value.trim();
      if (!value) return;
      localStorage.setItem('mc_wallpaper_type', 'url');
      localStorage.setItem('mc_wallpaper_value', value);
      window.mcApp.applySettings();
    });

    document.getElementById('saveWallpaperUpload').addEventListener('click', () => {
      const file = document.getElementById('wallpaperUpload').files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        localStorage.setItem('mc_wallpaper_type', 'url');
        localStorage.setItem('mc_wallpaper_value', String(reader.result));
        window.mcApp.applySettings();
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('resetWallpaper').addEventListener('click', () => {
      localStorage.removeItem('mc_wallpaper_type');
      localStorage.removeItem('mc_wallpaper_value');
      wallpaperUrl.value = '';
      window.mcApp.applySettings();
    });

    const bindToggle = (id, key, onValue, offValue) => {
      document.getElementById(id).addEventListener('change', (event) => {
        localStorage.setItem(key, event.target.checked ? onValue : offValue);
        window.mcApp.applySettings();
      });
    };
    bindToggle('animationsToggle', 'mc_animations', 'on', 'off');
    bindToggle('blurToggle', 'mc_blur', 'on', 'off');
    bindToggle('reducedMotionToggle', 'mc_reduced_motion', 'on', 'off');
    document.getElementById('compactCardToggle').addEventListener('change', (event) => {
      localStorage.setItem('mc_card_mode', event.target.checked ? 'compact' : 'normal');
      document.getElementById('largeCardToggle').checked = false;
      window.mcApp.applySettings();
    });
    document.getElementById('largeCardToggle').addEventListener('change', (event) => {
      localStorage.setItem('mc_card_mode', event.target.checked ? 'large' : 'normal');
      document.getElementById('compactCardToggle').checked = false;
      window.mcApp.applySettings();
    });

    document.getElementById('resetAllSettings').addEventListener('click', () => {
      ['mc_theme','mc_wallpaper_type','mc_wallpaper_value','mc_animations','mc_blur','mc_reduced_motion','mc_card_mode','mc_tab_name','mc_favicon_url'].forEach((key) => localStorage.removeItem(key));
      window.location.reload();
    });

    document.getElementById('saveTab').addEventListener('click', () => {
      localStorage.setItem('mc_tab_name', tabName.value.trim() || defaults.DEFAULT_TITLE);
      window.mcApp.applySettings();
    });

    document.getElementById('saveFaviconUrl').addEventListener('click', () => {
      localStorage.setItem('mc_favicon_url', faviconUrl.value.trim() || defaults.DEFAULT_FAVICON);
      window.mcApp.applySettings();
    });

    document.getElementById('saveFaviconUpload').addEventListener('click', () => {
      const file = document.getElementById('faviconUpload').files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        localStorage.setItem('mc_favicon_url', String(reader.result));
        window.mcApp.applySettings();
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('applyCloak').addEventListener('click', () => {
      localStorage.setItem('mc_tab_name', DEFAULT_CLOAK_TITLE);
      localStorage.setItem('mc_favicon_url', DEFAULT_CLOAK_FAVICON);
      tabName.value = DEFAULT_CLOAK_TITLE;
      faviconUrl.value = DEFAULT_CLOAK_FAVICON;
      window.mcApp.applySettings();
    });

    document.getElementById('resetCloak').addEventListener('click', () => {
      localStorage.removeItem('mc_tab_name');
      localStorage.removeItem('mc_favicon_url');
      tabName.value = defaults.DEFAULT_TITLE;
      faviconUrl.value = defaults.DEFAULT_FAVICON;
      window.mcApp.applySettings();
    });

    document.getElementById('savePreset').addEventListener('click', () => {
      const selected = document.getElementById('presetSelect').value;
      localStorage.setItem('mc_wallpaper_type', 'gradient');
      localStorage.setItem('mc_wallpaper_value', selected);
      window.mcApp.applySettings();
    });
  </script>
</body>
</html>
